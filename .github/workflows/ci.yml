name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup MoonBit
      uses: moonbitlang/setup-moonbit@v1

    - name: Moon format check
      run: moon fmt --check

    - name: Moon check
      run: moon check

    - name: Moon test
      run: moon test

    - name: Moon build
      run: moon build

    - name: Run basic example
      run: moon run ./examples/basic
